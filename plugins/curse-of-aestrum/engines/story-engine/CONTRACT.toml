# Public contract surface of Aria (story-engine).
#
# Aria is the genre-agnostic scene-management / authoring / disclosure layer that
# consuming works — and any system layer between Aria and a work — read directly.
# Anchors listed
# here are the wording-independent ids a consumer may cite as `<file>#<id>` (each
# section carries a matching `<!-- anchor: <id> -->` marker). Reword the heading
# freely — the anchor is the promise. The reference-integrity checker (fiction-host
# `refcheck`) enforces two things against this file:
#   1. a consumer citation into this engine must target an id listed below
#      (citing a private/internal anchor is an error), and
#   2. the consumer's declared target version must equal contract_version.
# Removing or renaming a public anchor is a BREAKING change: bump contract_version
# and update each consumer's [engines] pin.
#
# Whole-file dependencies (a consumer loading information_disclosure.md,
# private_information.md, scene_framing.md, story_lifecycle.md, file_layering.md,
# or the authoring_* modules without a fragment) are covered by the version pin
# above; only fragment-cited sections need an anchor entry here.
contract_version = 1

